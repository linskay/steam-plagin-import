name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: millennium-plugin/package-lock.json

    - name: Build and test Steam UI module
      working-directory: millennium-plugin
      shell: powershell
      run: |
        npm ci
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npx tsc --noEmit
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        node tests/ui-tests.mjs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npm run build
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run C# regression checks
      run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1
      shell: powershell

    - name: Compile Steam Epic Sync
      run: |
        & C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /target:winexe /out:SteamEpicSync.exe /lib:C:\Windows\Microsoft.NET\Framework64\v4.0.30319\WPF /r:PresentationCore.dll /r:PresentationFramework.dll /r:WindowsBase.dll /r:System.Xaml.dll /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Security.dll /r:System.Web.Extensions.dll /resource:MainWindow.xaml Program.cs VdfParser.cs EpicSyncManager.cs GameLauncher.cs TrayApplication.cs MainWindow.xaml.cs EpicApiManager.cs LoginWindow.cs SteamArtwork.cs SteamCollection.cs SteamUiSnapshot.cs SteamStoreMatcher.cs AppSettings.cs SteamSession.cs SteamBootstrap.cs
      shell: powershell

    - name: Package utility and module
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force release/millennium-plugin/dist | Out-Null
        Copy-Item SteamEpicSync.exe release/
        Copy-Item README.md release/
        Copy-Item millennium-plugin/install.ps1 release/millennium-plugin/
        Copy-Item millennium-plugin/README.md release/millennium-plugin/
        Copy-Item millennium-plugin/dist/*.star release/millennium-plugin/dist/
        Compress-Archive -Path release/* -DestinationPath SteamEpicSync-with-module.zip

    - name: Create or Update Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
        name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest Auto-Build' }}
        draft: false
        prerelease: false
        files: |
          SteamEpicSync.exe
          SteamEpicSync-with-module.zip
          millennium-plugin/dist/com.linskay.steamepicsync.star
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
